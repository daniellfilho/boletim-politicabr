<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Boletim — Boletim PoliticaBR</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .membros-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .membros-login-wrap {
    max-width: 440px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .membros-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 28px 26px;
    box-shadow: var(--shadow-card);
  }
  .membros-card h2 {
    color: var(--text-pure);
    margin-bottom: 8px;
  }
  .membros-card p {
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .membros-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-medium);
    background: var(--bg-surface);
    color: var(--text-pure);
    font-size: 1rem;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  .membros-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--gold-primary);
    color: var(--text-dark);
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
  }
  .membros-btn:disabled { opacity: 0.6; cursor: default; }
  .membros-msg {
    margin-top: 16px;
    font-size: 0.9rem;
    color: var(--text-main);
  }

  /* Cabeçalho do jornal */
  .jornal-header {
    text-align: center;
    margin-bottom: 8px;
  }
  .jornal-data {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .jornal-perfil-tag {
    display: inline-block;
    padding: 5px 14px;
    border-radius: var(--radius-full);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin: 12px 0 28px;
    color: #fff;
  }
  .tag-perfil-esquerda { background: rgba(220, 38, 38, 0.85); }
  .tag-perfil-centro {
    background: linear-gradient(90deg, rgba(220, 38, 38, 0.85) 0%, var(--gold-primary) 50%, rgba(29, 78, 216, 0.85) 100%);
    color: var(--text-dark);
  }
  .tag-perfil-direita { background: rgba(29, 78, 216, 0.85); }

  /* Cards de matéria */
  .materia-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 22px;
    box-shadow: var(--shadow-card);
  }
  .materia-imagem {
    width: 100%;
    height: 190px;
    background: var(--bg-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .materia-imagem img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .materia-imagem .placeholder-icon {
    font-size: 2.4rem;
    opacity: 0.35;
  }
  .materia-corpo {
    padding: 18px 20px 20px;
  }
  .materia-categoria {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--gold-primary);
    background: var(--gold-soft);
    border: 1px solid var(--border-gold);
    padding: 3px 10px;
    border-radius: var(--radius-full);
    margin-bottom: 10px;
  }
  .materia-titulo {
    color: var(--text-pure);
    font-size: 1.1rem;
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .materia-resumo {
    color: var(--text-main);
    font-size: 0.92rem;
    line-height: 1.55;
    margin-bottom: 12px;
  }
  .materia-fonte {
    font-size: 0.76rem;
    color: var(--text-dim);
    text-decoration: none;
  }
  .materia-fonte:hover { text-decoration: underline; }

  .membros-sem-perfil {
    color: var(--text-muted);
    line-height: 1.6;
    text-align: center;
    padding: 40px 20px;
  }
  .membros-sem-perfil a {
    color: var(--gold-primary);
    font-weight: 700;
  }
  .membros-sair {
    display: block;
    text-align: center;
    margin-top: 12px;
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<!-- Estado: NÃO logado (formulário de e-mail) -->
<div class="membros-login-wrap" id="login-wrap">
  <div class="membros-card">
    <h2>Área de Membros</h2>
    <p>Digite o e-mail que você usou na assinatura. Vamos te enviar um link de acesso.</p>
    <input type="email" id="login-email" class="membros-input" placeholder="seu@email.com" required>
    <button id="login-btn" class="membros-btn">Enviar link de acesso</button>
    <p class="membros-msg" id="login-msg"></p>
  </div>
</div>

<!-- Estado: logado (o jornal de verdade) -->
<div class="membros-wrap" id="jornal-wrap" style="display:none;">
  <div class="jornal-header">
    <div class="jornal-data" id="jornal-data"></div>
    <div>
      <span class="jornal-perfil-tag" id="perfil-tag"></span>
    </div>
  </div>

  <div id="lista-materias"></div>

  <div id="sem-perfil" class="membros-sem-perfil" style="display:none;">
    <p>Ainda não identificamos seu perfil político. Faça o diagnóstico rápido
    para liberar sua edição personalizada:</p>
    <p><a href="/index.html">Fazer o diagnóstico agora →</a></p>
  </div>

  <span class="membros-sair" id="logout-link">sair da conta</span>
</div>

<script>
(function () {
  const loginWrap = document.getElementById('login-wrap');
  const jornalWrap = document.getElementById('jornal-wrap');
  const loginBtn = document.getElementById('login-btn');
  const loginEmail = document.getElementById('login-email');
  const loginMsg = document.getElementById('login-msg');

  loginBtn.addEventListener('click', async () => {
    const email = loginEmail.value.trim();
    if (!email) return;
    loginBtn.disabled = true;
    loginBtn.textContent = 'Enviando...';
    try {
      const res = await fetch('/api/request-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      loginMsg.textContent = data.message || 'Se este e-mail tiver assinatura ativa, enviamos um link de acesso.';
    } catch (err) {
      loginMsg.textContent = 'Não foi possível enviar agora. Tente novamente em instantes.';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Enviar link de acesso';
    }
  });

  const LABELS_PERFIL = { esquerda: 'Esquerda', centro: 'Centro', direita: 'Direita' };
  const ICONES_CATEGORIA = '📰';

  function renderJornal(lado, feed) {
    const listaEl = document.getElementById('lista-materias');
    const semPerfil = document.getElementById('sem-perfil');
    const perfilTag = document.getElementById('perfil-tag');

    if (!lado || !feed || !Array.isArray(feed.noticias) || feed.noticias.length === 0) {
      listaEl.style.display = 'none';
      perfilTag.style.display = 'none';
      semPerfil.style.display = 'block';
      return;
    }

    perfilTag.style.display = 'inline-block';
    perfilTag.textContent = 'SEU PERFIL: ' + (LABELS_PERFIL[lado] || lado).toUpperCase();
    perfilTag.className = 'jornal-perfil-tag tag-perfil-' + lado;

    const dataFormatada = feed.gerado_em
      ? new Date(feed.gerado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })
      : '';
    document.getElementById('jornal-data').textContent = dataFormatada ? 'Edição de ' + dataFormatada : '';

    listaEl.innerHTML = '';
    feed.noticias.forEach((noticia) => {
      const versao = noticia[lado];
      if (!versao) return;

      const card = document.createElement('article');
      card.className = 'materia-card';

      const imagemHtml = noticia.imagem_url
        ? `<img src="${noticia.imagem_url}" alt="${versao.manchete}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder-icon',textContent:'${ICONES_CATEGORIA}'}))">`
        : `<span class="placeholder-icon">${ICONES_CATEGORIA}</span>`;

      const fonteHtml = noticia.fonte_url
        ? `<a class="materia-fonte" href="${noticia.fonte_url}" target="_blank" rel="noopener noreferrer">Fonte: ${noticia.fonte_nome || 'ver matéria original'} →</a>`
        : '';

      card.innerHTML = `
        <div class="materia-imagem">${imagemHtml}</div>
        <div class="materia-corpo">
          <span class="materia-categoria">${noticia.categoria || 'Política'}</span>
          <h3 class="materia-titulo">${versao.manchete}</h3>
          <p class="materia-resumo">${versao.resumo}</p>
          ${fonteHtml}
        </div>
      `;
      listaEl.appendChild(card);
    });

    listaEl.style.display = 'block';
    semPerfil.style.display = 'none';
  }

  async function carregarFeed(lado) {
    try {
      const res = await fetch('noticias-diarias.json', { cache: 'no-store' });
      const feed = await res.json();
      renderJornal(lado, feed);
    } catch (err) {
      document.getElementById('lista-materias').innerHTML =
        '<p style="color:var(--text-muted);text-align:center;">Não foi possível carregar a edição de hoje.</p>';
    }
  }

  document.getElementById('logout-link').addEventListener('click', () => {
    document.cookie = 'boletim_session=; Path=/; Max-Age=0';
    window.location.reload();
  });

  // Ao carregar a página, confere se já existe sessão válida e ativa
  fetch('/api/check-session')
    .then((res) => res.json())
    .then((data) => {
      if (data.authenticated) {
        loginWrap.style.display = 'none';
        jornalWrap.style.display = 'block';
        carregarFeed(data.perfil);
      }
    })
    .catch(() => {});
})();
</script>

</body>
</html>
